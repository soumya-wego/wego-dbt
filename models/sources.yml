# Sources = tables dbt READS but does not build. Generated by scripts/generate_sources.py
# from the live scheduled-query inventory; table names are the real BigQuery names,
# unchanged. Roles: l1 = data-engineering built, dim = lookup (any layer may read),
# raw = feed (the L1 shelf per the redesign plan), legacy = analysis/pricing_engine.
# A legacy table that is itself a scheduled-query destination is a BRIDGE: a
# temporary source until its query migrates, then every reader's source() becomes a
# ref(). Bridges are marked below.
